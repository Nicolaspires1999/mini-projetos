<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculadora">
    <div class="visor">
      <div id="historico" class="historico" aria-live="polite"></div>
      <output id="resultado" class="resultado">0</output>
    </div>
    <div class="teclas">
      <button data-acao="limpar" class="aux">C</button>
      <button data-acao="apagar" class="aux">⌫</button>
      <button data-acao="porcentagem" class="aux">%</button>
      <button data-op="/" class="op">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*" class="op">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op">+</button>

      <button data-acao="inverter" class="aux">±</button>
      <button data-num="0">0</button>
      <button data-acao="ponto">,</button>
      <button data-acao="igual" class="igual">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
